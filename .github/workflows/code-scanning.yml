name: "Code Scanning analysis"

on:
  push:
    # this workflow would be executed at any push event to master or develop branches
    branches: [master, develop]
  pull_request:
    # this workflow would be executed at any pull request event with base branch master or develop branches
    branches: [master, develop]
  workflow_dispatch:
    # this workflow would be executed when a workflow_dispatch event is executed (via API or manually)

jobs:
  CodeQL:
    # uses code-scanning javascript workflow
    uses: /catiabusiness/mordor_code-scanning-workflow/.github/workflows/js.yml@master
    secrets: inherit